[project]
name = "github-actions-python-testing-pytest"
version = "0.1.0"
description = "Shipping example with pytest coverage and a GitHub Actions workflow"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.pytest]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
