[project]
name = "testing-levels-unit-converter"
version = "0.1.0"
description = "The same Python unit converter tested at three different boundaries"
requires-python = ">=3.13"
dependencies = ["typer>=0.21,<1"]

[project.scripts]
units-convert = "unit_converter.cli:app"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unit_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "acceptance: checks an agreed user requirement",
    "regression: guards the offset-subtraction defect demonstrated in the README",
]
