[project]
name = "langgraph-agent-testing"
version = "0.1.0"
description = "Runnable LangGraph agent testing example using pytest and pytest-mock"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
