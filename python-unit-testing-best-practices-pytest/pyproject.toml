[project]
name = "python-unit-testing-best-practices-pytest"
version = "0.1.0"
description = "Fee and reminder examples for maintainable Python unit tests"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.pytest]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
