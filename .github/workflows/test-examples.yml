name: Test examples

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  pytest-llm-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytest-llm-fixtures
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pytest-llm-fixtures/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check offline LLM testing examples
        run: ./scripts/check

  pytest-fixtures-parametrization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytest-fixtures-parametrization
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pytest-fixtures-parametrization/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check fixture and parametrization examples
        run: sh scripts/check

  fastapi-testing-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-testing-pytest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: fastapi-testing-pytest/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest test_main.py -v

  langgraph-agent-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langgraph-agent-testing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: langgraph-agent-testing/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest test_agent.py -v

  pytest-hooks-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytest-hooks-examples
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pytest-hooks-examples/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the default environment tests
        run: uv run pytest -q
      - name: Run the staging environment tests
        run: uv run pytest -q --env=staging

  test-driven-development-python-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-driven-development-python-pytest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: test-driven-development-python-pytest/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest test_inventory.py -v

  behavior-driven-development-python-pytest-bdd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: behavior-driven-development-python-pytest-bdd
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: behavior-driven-development-python-pytest-bdd/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m pytest -q

  pytest-mocking-tutorial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytest-mocking-tutorial
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pytest-mocking-tutorial/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m pytest -q

  unit-integration-e2e-testing-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unit-integration-e2e-testing-python
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: unit-integration-e2e-testing-python/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m pytest -q

  pytest-for-beginners-first-python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytest-for-beginners-first-python-test
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pytest-for-beginners-first-python-test/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m pytest test_shop.py -v

  python-unit-testing-best-practices-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-unit-testing-best-practices-pytest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python-unit-testing-best-practices-pytest/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m pytest -q

  github-actions-python-testing-pytest:
    name: GitHub Actions example (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: github-actions-python-testing-pytest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: github-actions-python-testing-pytest/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run pytest with coverage
        run: |
          uv run python -m pytest \
            --cov=shop \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100 \
            --junitxml=test-results/pytest.xml
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-pytest-python-${{ matrix.python-version }}
          path: |
            github-actions-python-testing-pytest/coverage.xml
            github-actions-python-testing-pytest/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
