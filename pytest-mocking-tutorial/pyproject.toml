[project]
name = "pytest-mocking-tutorial"
version = "0.1.0"
description = "A small wallet for learning pytest-mock, mock drift, and patching"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
